<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171411" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
    <title>Mage Knight · Campaign Atlas</title>
  </head>
  <body class="atlas">
    <header>
      <span class="seal">✥</span
      ><span>Mage Knight<small>Campaign atlas</small></span
      ><button id="menu">Expeditions</button>
    </header>
    <main id="app"><p>Opening the atlas…</p></main>
    <dialog id="detail" aria-labelledby="sheet-title">
      <div class="sheet-heading">
        <h2 id="sheet-title"></h2>
        <button id="close">Close</button>
      </div>
      <article></article>
    </dialog>
    <dialog id="ledger" aria-labelledby="ledger-title">
      <div class="sheet-heading">
        <h2 id="ledger-title"></h2>
        <button id="dismiss-ledger">Close</button>
      </div>
      <section id="panel"></section>
    </dialog>
    <footer>
      <a href="../play.html">Check for updates</a>
      <button id="books">Rulebooks</button
      ><span id="status" role="status"></span>
    </footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
